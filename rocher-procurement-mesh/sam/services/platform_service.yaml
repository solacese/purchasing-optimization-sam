# Platform Service configuration for Procurement Intelligence Mesh

namespace: ${NAMESPACE}
shared_config:
  - ../shared_config.yaml

components:
  - component_type: PlatformService
    component_name: ProcurementPlatformService
    component_module: solace_agent_mesh.platform_service.app

    configuration:
      host: "0.0.0.0"
      port: 8001

      database_url: "sqlite:///procurement_platform.db"

      deployment_timeout_minutes: 5
      heartbeat_timeout_seconds: 90
      max_message_size_bytes: 10485760

      cors_origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "http://localhost:8090"

      oauth_enabled: false
